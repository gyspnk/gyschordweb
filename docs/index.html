    <!-- Loading screen: tampil sampai elemen utama (font/icon + daftar
         pujian) selesai dimuat. MIDI tidak ditunggu — ia punya loading
         bar sendiri. -->
    <div id="app-loading-screen" aria-hidden="true">
      <div class="app-loading-inner">
        <img
          class="app-loading-logo app-loading-logo-color"
          src="./assets/logo/tjc_logo_indonesia_color.png"
          alt="Gereja Yesus Sejati"
          draggable="false"
        />
        <img
          class="app-loading-logo app-loading-logo-white"
          src="./assets/logo/tjc_logo_indonesia_white.png"
          alt=""
          draggable="false"
        />
        <div class="app-loading-bar" role="progressbar" aria-label="Memuat">
          <div class="app-loading-bar-fill"></div>
        </div>
        <div class="app-loading-label">Memuat… 0%</div>
      </div>
      <style>
        #app-loading-screen {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #faf8f4;
          transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #app-loading-screen.is-done {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .app-loading-inner {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }
        .app-loading-logo {
          width: 132px;
          height: auto;
          user-select: none;
          -webkit-user-drag: none;
        }
        .app-loading-logo-white {
          display: none;
        }
        .app-loading-bar {
          width: 168px;
          height: 5px;
          border-radius: 999px;
          background: rgba(141, 110, 63, 0.18);
          overflow: hidden;
        }
        .app-loading-bar-fill {
          height: 100%;
          width: 0%;
          border-radius: 999px;
          background: #8d6e3f;
          transition: width 0.35s ease;
        }
        .app-loading-label {
          font-family: system-ui, -apple-system, "Segoe UI", Roboto,
            sans-serif;
          font-size: 0.8rem;
          letter-spacing: 0.06em;
          color: rgba(60, 50, 40, 0.55);
          font-variant-numeric: tabular-nums;
        }
        @media (prefers-color-scheme: dark) {
          #app-loading-screen {
            background: #1a1714;
          }
          .app-loading-logo-color {
            display: none;
          }
          .app-loading-logo-white {
            display: block;
          }
          .app-loading-bar {
            background: rgba(201, 162, 39, 0.22);
          }
          .app-loading-bar-fill {
            background: #c9a227;
          }
          .app-loading-label {
            color: rgba(235, 225, 210, 0.55);
          }
        }
      </style>
    </div>
    <div id="root"></div>
    <script>
      // Sembunyikan loading screen setelah elemen utama siap: window load
      // (semua aset statis) + font/icon (Material Symbols & Google Fonts)
      // + daftar pujian ter-render. MIDI TIDAK ditunggu di sini.
      // Loading bar menampilkan PERSENTASE progres (estimasi bertahap).
      (function () {
        var el = document.getElementById("app-loading-screen");
        if (!el) return;
        var fill = el.querySelector(".app-loading-bar-fill");
        var label = el.querySelector(".app-loading-label");
        var startedAt = Date.now();
        var MIN_SHOW_MS = 600;
        var MAX_WAIT_MS = 9000;
        var hidden = false;
        var progress = 0;

        function setProgress(p) {
          progress = Math.max(progress, Math.min(100, p));
          if (fill) fill.style.width = progress + "%";
          if (label) label.textContent = "Memuat… " + Math.round(progress) + "%";
        }

        function hide() {
          if (hidden) return;
          hidden = true;
          setProgress(100);
          var waited = Date.now() - startedAt;
          var delay = Math.max(0, MIN_SHOW_MS - waited);
          setTimeout(function () {
            el.classList.add("is-done");
            setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 520);
          }, delay);
        }

        function listReady() {
          var list = document.getElementById("pujian-list");
          return !!(list && list.children.length > 0);
        }

        // Progres bertahap (estimasi): DOM siap = 25%, window load = 55%,
        // font/icon siap = 75%, daftar pujian = 90%. Merayap +2%/150ms
        // sampai 88% agar terasa hidup saat aset masih dimuat.
        setProgress(4);
        var creep = setInterval(function () {
          if (!hidden && progress < 88) setProgress(progress + 2);
        }, 150);

        function ready() {
          var fontsReady =
            document.fonts && document.fonts.ready
              ? document.fonts.ready.catch(function () {})
              : Promise.resolve();
          var assetsReady = new Promise(function (resolve) {
            var t0 = Date.now();
            (function poll() {
              if (listReady()) {
                setProgress(90);
                resolve();
              } else if (Date.now() - t0 > 6000) {
                resolve();
              } else {
                setTimeout(poll, 120);
              }
            })();
          });
          Promise.all([fontsReady, assetsReady]).then(function () {
            clearInterval(creep);
            setProgress(96);
            setTimeout(hide, 150);
          });
        }

        if (document.readyState === "complete") ready();
        else {
          document.addEventListener("DOMContentLoaded", function () {
            setProgress(25);
          });
          window.addEventListener("load", function () {
            setProgress(55);
            ready();
          });
        }
        // Jaring pengaman: bagaimanapun juga loading screen pasti hilang.
        setTimeout(function () {
          clearInterval(creep);
          hide();
        }, MAX_WAIT_MS);
      })();
    </script>
