name: Verify build & versions

# Mencegah dua penyebab "update otomatis tidak jalan":
#   1) versi/?v= di banyak berkas tidak sinkron (APP_VERSION vs GYS_CLIENT_BUILD,
#      index.html vs nilai hardcoded di bundle React), dan
#   2) bundle (app.bundle.min.js / sw.min.js) lupa di-build ulang dari sumber.
# Selain itu seluruh test regresi (test/*.test.mjs) dijalankan di sini.
#
# Path yang dipantau sengaja dipersempit:
#   • Folder data murni (assets/pdf, assets/chord, assets/midi, assets/soundfont,
#     assets/logo) TIDAK memicu workflow ini: isinya hanya data, manifest-nya
#     diurus workflow "Generate assets-list.json", jadi `npm ci` + build tidak
#     perlu dijalankan. `assets/fonts/**` tetap dipantau karena test icon subset
#     membaca font subset di sana.
#   • Manifest hasil commit otomatis CI (docs/assets-list.json,
#     docs/assets-chord-list.json, docs/assets-chord-manifest.json) diabaikan
#     supaya commit otomatis itu tidak memicu verifikasi ulang yang sama.
#
# Daftar path sengaja ditulis ulang di `push` dan `pull_request` (bukan YAML
# anchor) agar berkas workflow ini tetap sederhana dibaca/di-diff; ingat ubah
# keduanya bila menambah path.

on:
  push:
    paths:
      - "docs/**"
      - "!docs/assets/chord/**"
      - "!docs/assets/logo/**"
      - "!docs/assets/midi/**"
      - "!docs/assets/pdf/**"
      - "!docs/assets/soundfont/**"
      - "!docs/assets-chord-list.json"
      - "!docs/assets-chord-manifest.json"
      - "!docs/assets-list.json"
      - "!docs/generate_assets_list.py"
      - "test/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "docs/**"
      - "!docs/assets/chord/**"
      - "!docs/assets/logo/**"
      - "!docs/assets/midi/**"
      - "!docs/assets/pdf/**"
      - "!docs/assets/soundfont/**"
      - "!docs/assets-chord-list.json"
      - "!docs/assets-chord-manifest.json"
      - "!docs/assets-list.json"
      - "!docs/generate_assets_list.py"
      - "test/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify.yml"

# Verifikasi hanya membaca repo: token tidak butuh izin tulis apa pun.
permissions:
  contents: read

# Push berturut-turut (mis. commit susulan cepat): batalkan run lama yang belum
# selesai supaya tidak menumpuk tanpa guna.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Node 24 (LTS aktif). Sengaja TANPA `cache: npm`: dependensi hanya 5
      # paket dan `npm ci` selesai ~1 detik, jadi restore/save cache justru
      # menambah waktu.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Cek versi sinkron
        run: npm run version:check

      - name: Cek bundle sudah di-build ulang
        run: |
          npm run build
          if ! git diff --quiet -- \
            docs/js/app.bundle.min.js \
            docs/sw.min.js \
            docs/js/midi-render-worker.min.js; then
            echo "::error::Bundle tidak sinkron dengan sumber. Jalankan 'npm run build' lalu commit hasilnya."
            git --no-pager diff --stat -- \
              docs/js/app.bundle.min.js \
              docs/sw.min.js \
              docs/js/midi-render-worker.min.js
            exit 1
          fi

      # Test regresi (navigasi, transisi halaman, list, sw, icon subset, versi)
      # ikut dijalankan supaya berkas test yang ada benar-benar menjaga CI.
      - name: Test regresi
        run: npm test
