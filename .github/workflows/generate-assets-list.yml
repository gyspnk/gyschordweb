name: Generate assets-list.json

on:
  push:
    paths:
      - 'docs/assets/**'
      - 'docs/chord-sources.json'
      - 'docs/generate_assets_list.py'
      - '.github/workflows/generate-assets-list.yml'
  pull_request:
    paths:
      - 'docs/assets/**'
      - 'docs/chord-sources.json'
      - 'docs/generate_assets_list.py'
      - '.github/workflows/generate-assets-list.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One publisher per branch at a time so two rapid pushes cannot interleave;
  # the retry loop below still guards against a stale non-fast-forward push.
  group: generate-assets-list-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-assets-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Rebase-based push retry needs full history of the branch tip.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate asset manifests (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python docs/generate_assets_list.py --validate

      - name: Generate asset manifests
        if: github.event_name != 'pull_request'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python docs/generate_assets_list.py

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets-list.json docs/assets-chord-list.json docs/assets-chord-manifest.json
          if git diff --cached --quiet; then
            echo "Manifests are already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "Update asset manifests (PDFs + chords, SHA-256) [auto]"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4; do
            if git push "$REMOTE_URL" "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest ${BRANCH} and retrying."
            git fetch "$REMOTE_URL" "$BRANCH"
            git rebase "FETCH_HEAD"
          done
          echo "Failed to push asset manifests after 4 attempts."
          exit 1

      - name: Write job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Asset manifest generation"
            echo ""
            git diff --stat --cached docs/assets-list.json docs/assets-chord-list.json docs/assets-chord-manifest.json
            echo ""
            echo "Chord entries: $(python -c "import json;print(len(json.load(open('docs/assets-chord-manifest.json','encoding=utf-8'))['files']))")"
          } >> "$GITHUB_STEP_SUMMARY"
